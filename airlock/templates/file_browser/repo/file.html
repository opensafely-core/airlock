{% fragment as buttons %}
  <div class="flex items-center gap-2">
    <os-dropdown>
      <os-dropdown-item
        icon="/static/icons/open_in_new.svg"
        href="{{path_item.contents_url}}"
        target="_blank"
        rel="noopener noreferrer"
        link-id="view-button"
      >
        Open in new tab
      </os-dropdown-item>
      <os-dropdown-item
        icon="/static/icons/open_in_new.svg"
        href="{{path_item.contents_plaintext_url}}"
        target="_blank"
        rel="noopener noreferrer"
        link-id="plain-text-button"
      >
        Open as plain text
      </os-dropdown-item>
    </os-dropdown>
  </div>
{% endfragment %}

{% include "file_browser/_includes/file_content.html" %}
