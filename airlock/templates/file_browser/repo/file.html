{% fragment as buttons %}
  <div class="flex items-center gap-2">
    <airlock-dropdown>
      <airlock-dropdown-item
        icon="/static/icons/open_in_new.svg"
        href="{{path_item.contents_url}}"
        target="_blank"
        rel="noopener noreferrer"
        id="view-button"
      >
        Open in new tab
      </airlock-dropdown-item>
      <airlock-dropdown-item
        icon="/static/icons/open_in_new.svg"
        href="{{path_item.contents_plaintext_url}}"
        target="_blank"
        rel="noopener noreferrer"
        id="plain-text-button"
      >
        Open as plain text
      </airlock-dropdown-item>
    </airlock-dropdown>
  </div>
{% endfragment %}

{% include "file_browser/_includes/file_content.html" %}
