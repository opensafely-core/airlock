<li
  {% if disabled %}
    class="block px-4 py-3 font-semibold cursor-not-allowed text-slate-700 wrap-break-word sm:px-6 {{ class }}"
  {% endif %}
>
  {% if not disabled %}
  <a

    class="
      block transition-colors duration-200 px-4 py-3 font-semibold text-oxford-600 wrap-break-word
      hover:bg-oxford-50
      focus:bg-oxford-50 focus:outline-hidden focus:ring-2 focus:ring-inset
      sm:px-6
      {{ class }}
    "
    {% attrs aria_checked aria_labelled_by href role %}
  >
  {% endif %}
    {{ children }}
  {% if not disabled %}
  </a>
  {% endif %}
</li>
