name: Deploy
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/main.yml
    with:
      build-artifact-name: image

  push-and-sign-image:
    name: Publish Docker image
    needs: ci
    permissions:
      packages: write
      id-token: write
      attestations: write    
      artifact-metadata: write
    uses: ./.github/workflows/push-and-sign-image.yml
    with:
      artifact-name: image
      public-image-name: ghcr.io/opensafely-core/airlock
      tag: latest
